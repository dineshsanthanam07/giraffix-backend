spring.application.name=giraffix-backend
server.port=8080

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=314611395198-msralspr93n0rc9b18rang85i124h7rf.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/giraffix
spring.datasource.username=giraffix
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Session timeout: 30 minutes of inactivity
server.servlet.session.timeout=30m

# Prevent JavaScript from reading session cookie
server.servlet.session.cookie.http-only=true

# Same-site cookie protection
server.servlet.session.cookie.same-site=lax
# =====================================
# SWAGGER UI
# =====================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true

# Adopt the existing Hibernate-created schema as V1 without recreating tables.
# Disable baseline-on-migrate after the first successful startup against that database.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Anthropic Claude Configuration
giraffix.ai.api-key=${ANTHROPIC_API_KEY}
giraffix.ai.base-url=https://api.anthropic.com/v1
giraffix.ai.model=claude-haiku-5-5
giraffix.ai.api-version=2023-06-01
giraffix.ai.max-tokens=1024
giraffix.ai.max-image-size-bytes=5242880
giraffix.ai.max-images=5
giraffix.ai.max-total-image-size-bytes=20971520

# Concept extraction has its own model, with the shared AI API URL and credentials.
giraffix.concept.model=claude-sonnet-5-5
giraffix.concept.max-tokens=2048
giraffix.concept.max-image-size-bytes=5242880

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=21MB

# AWS S3 configuration. Enter your credentials below and confirm the bucket region.
# Images are uploaded only when the user confirms/saves a product.
giraffix.storage.s3.bucket=replic-media-prod
giraffix.storage.s3.region=us-east-1
giraffix.storage.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
giraffix.storage.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# Only required for temporary AWS credentials; otherwise leave blank.
giraffix.storage.s3.session-token=
# Required object permissions: s3:PutObject and s3:DeleteObject on products/* and concept/*.

# Product analysis diagnostics. DEBUG includes bounded extracted field values.
logging.group.giraffix-diagnostics=com.giraffix.config,com.giraffix.product.service,com.giraffix.selection,com.giraffix.generation,com.giraffix.prompt
logging.level.giraffix-diagnostics=${GIRAFFIX_LOG_LEVEL:INFO}
logging.pattern.level=%5p [requestId:%X{requestId:-none} operationId:%X{operationId:-none}]
logging.file.name=logs/giraffix.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Concept picker: random approved concepts per batch, score threshold, total rounds.
giraffix.selection.picker-enabled=true
giraffix.selection.batch-size=5
giraffix.selection.threshold=80
giraffix.selection.max-rounds=3

# Single ad flow: Claude writes the creative prompt, OpenAI GPT Image 2 renders it directly.
# Set OPENAI_API_KEY in the backend process environment; do not commit credentials.
giraffix.generation.openai.api-key=${OPENAI_API_KEY}
giraffix.generation.openai.base-url=https://api.openai.com/v1
giraffix.generation.openai.model=gpt-image-2.6-sunburst
giraffix.generation.prompt-model=claude-sonnet-5-5
giraffix.generation.prompt-reserve-micros=400000
giraffix.generation.prompt-max-output-tokens=8192
